<!doctype html><meta charset="utf-8"><title>Visualizer QA</title><p id="s">Starting</p><img id="o" style="max-width:600px"><script>
(async()=>{const s=document.querySelector('#s');try{const c=document.createElement('canvas');c.width=900;c.height=600;const x=c.getContext('2d');x.fillStyle='#83c5e8';x.fillRect(0,0,900,600);x.fillStyle='#86a96a';x.fillRect(0,440,900,160);x.fillStyle='#ddd6c8';x.fillRect(180,290,540,230);x.fillStyle='#565d66';x.beginPath();x.moveTo(120,310);x.lineTo(450,90);x.lineTo(780,310);x.closePath();x.fill();x.fillStyle='#202938';x.fillRect(250,360,120,160);x.fillStyle='#b7d8e8';x.fillRect(520,350,110,90);const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.9));const data=(await new Promise((r,j)=>{const f=new FileReader();f.onload=()=>r(f.result.split(',')[1]);f.onerror=j;f.readAsDataURL(b)}));s.textContent='Requesting';const res=await fetch('/api/visualize',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({imageData:data,mimeType:'image/jpeg',material:'standing-seam metal roofing',color:'forest green',consent:true,website:''})});const p=await res.json();s.textContent=res.status+' '+(p.error||'OK');if(p.imageData)document.querySelector('#o').src='data:'+(p.mimeType||'image/png')+';base64,'+p.imageData}catch(e){s.textContent='ERROR '+e.message}})()
</script>
